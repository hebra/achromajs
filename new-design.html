<!DOCTYPE html>

<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#00429b",
                        "on-secondary": "#370096",
                        "secondary-container": "#5203d5",
                        "secondary-fixed-dim": "#cdbdff",
                        "tertiary-fixed-dim": "#ffb688",
                        "surface-container-high": "#2a2a2c",
                        "error-container": "#93000a",
                        "on-secondary-container": "#c0acff",
                        "on-primary-fixed": "#001945",
                        "on-primary-container": "#f8f8ff",
                        "inverse-surface": "#e5e1e4",
                        "on-tertiary-container": "#fff7f4",
                        "on-tertiary-fixed-variant": "#733600",
                        "on-secondary-fixed": "#20005f",
                        "tertiary-fixed": "#ffdbc7",
                        "surface-container-lowest": "#0e0e10",
                        "surface-bright": "#39393b",
                        "background": "#131315",
                        "surface-variant": "#353437",
                        "on-surface-variant": "#cac3d8",
                        "on-surface": "#e5e1e4",
                        "primary": "#b0c6ff",
                        "on-tertiary-fixed": "#311300",
                        "on-primary": "#002d6e",
                        "inverse-primary": "#0058ca",
                        "secondary-fixed": "#e8deff",
                        "surface": "#131315",
                        "secondary": "#cdbdff",
                        "error": "#ffb4ab",
                        "on-background": "#e5e1e4",
                        "surface-container-low": "#1b1b1d",
                        "on-error": "#690005",
                        "tertiary-container": "#b55800",
                        "surface-tint": "#b0c6ff",
                        "outline-variant": "#494455",
                        "outline": "#948ea1",
                        "inverse-on-surface": "#303032",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#056bf1",
                        "tertiary": "#ffb688",
                        "surface-container": "#201f21",
                        "primary-fixed-dim": "#b0c6ff",
                        "on-tertiary": "#512400",
                        "surface-container-highest": "#353437",
                        "surface-dim": "#131315",
                        "on-secondary-fixed-variant": "#4f00d0",
                        "primary-fixed": "#d9e2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            width: 360px;
            height: 540px;
            overflow-x: hidden;
            background-color: #131315;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1b1b1d;
        }

        ::-webkit-scrollbar-thumb {
            background: #353437;
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(53, 52, 55, 0.4);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="font-body text-on-surface bg-background">
<!-- TopAppBar -->
<main class="px-4 pt-2 space-y-6">
    <!-- General Filters (Segmented Control Style) -->
    <section class="space-y-3">
        <h2 class="font-headline text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant px-1">
            General Filters</h2>
        <div class="bg-surface-container-high p-1.5 rounded-full flex gap-1">
            <button class="flex-1 py-2 text-[11px] font-semibold rounded-full bg-surface-bright text-on-surface shadow-sm transition-all">
                None
            </button>
            <button class="flex-1 py-2 text-[11px] font-semibold rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
                Light
            </button>
            <button class="flex-1 py-2 text-[11px] font-semibold rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
                Medium
            </button>
            <button class="flex-1 py-2 text-[11px] font-semibold rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
                Strong
            </button>
        </div>
    </section>
    <!-- Visual Effects (Segmented Control Pill) -->
    <section class="space-y-3">
        <h2 class="font-headline text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant px-1">
            Visual Effects</h2>
        <div class="bg-surface-container-high p-1.5 rounded-full flex gap-1">
            <button class="flex-1 py-2 text-xs font-semibold rounded-full bg-surface-bright text-on-surface shadow-sm transition-all">
                None
            </button>
            <button class="flex-1 py-2 text-xs font-semibold rounded-full transition-all text-on-surface-variant hover:text-on-surface">
                Invert Colors
            </button>
            <button class="flex-1 py-2 text-xs font-semibold rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
                Low Contrast
            </button>
            <button class="flex-1 py-2 text-xs font-semibold rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
                High Contrast
            </button>
        </div>
    </section>
    <!-- Color Deficiencies (CVD) List -->
    <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
            <h2 class="font-headline text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant">Color
                Deficiencies</h2>
        </div>
        <div class="bg-surface-container-low rounded-lg overflow-hidden">
            <div class="flex flex-col">
                <!-- Option Item -->
                <div class="flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors group cursor-pointer">
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-on-surface">Achromatomaly</span>
                        <span class="text-[10px] text-on-surface-variant">Partial color blindness</span>
                    </div>
                    <div class="w-12 h-6 rounded-full bg-surface-variant relative flex items-center px-1">
                        <div class="w-4 h-4 rounded-full bg-outline shadow-sm"></div>
                    </div>
                </div>
                <div class="h-[1px] mx-4 bg-outline-variant/10"></div>
                <div class="flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors group cursor-pointer">
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-on-surface">Achromatopsia</span>
                        <span class="text-[10px] text-on-surface-variant">Complete color blindness</span>
                    </div>
                    <div class="w-12 h-6 rounded-full bg-surface-variant relative flex items-center px-1">
                        <div class="w-4 h-4 rounded-full bg-outline shadow-sm"></div>
                    </div>
                </div>
                <div class="h-[1px] mx-4 bg-outline-variant/10"></div>
                <div class="flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors group cursor-pointer bg-[#b0c6ff]/5">
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-primary">Protanomaly</span>
                        <span class="text-[10px] text-primary/60">Red-weak</span>
                    </div>
                    <div class="w-12 h-6 rounded-full bg-primary/20 relative flex items-center justify-end px-1">
                        <div class="w-4 h-4 rounded-full bg-primary shadow-lg shadow-primary/20"></div>
                    </div>
                </div>
                <div class="h-[1px] mx-4 bg-outline-variant/10"></div>
                <!-- Remaining CVD items -->
                <div class="flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors group cursor-pointer">
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-on-surface">Protanopia</span>
                        <span class="text-[10px] text-on-surface-variant">Red-blind</span>
                    </div>
                    <div class="w-12 h-6 rounded-full bg-surface-variant relative flex items-center px-1">
                        <div class="w-4 h-4 rounded-full bg-outline shadow-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<!-- BottomNavBar -->
</body>
</html>
